openapi: 3.0.3
info:
  title: cixing api
  version: 1.0.0
  description: |
    Cixing ("姝よ") API V1.0.

servers:
  - url: /

tags:
  - name: Health
  - name: Auth
  - name: Official
  - name: Review
  - name: CustomKeywords
  - name: UploadSessions
  - name: Reactions
  - name: Me
  - name: Analytics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    X-Request-ID:
      description: Correlation id for tracing.
      schema:
        type: string

  parameters:
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional client-provided request id for tracing.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: Optional idempotency key.

  responses:
    BadRequest:
      description: Bad Request (validation failed)
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    Unauthorized:
      description: Unauthorized
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not Found
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too Many Requests (code=rate_limited, reason=common.rate_limited). Retry with backoff; this does not determine daily selection state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request body exceeds 32768 bytes (32 KiB). The entire batch is rejected; code=validation, reason=validation.failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            code: validation
            reason: validation.failed
            message: Request body exceeds 32768 bytes
            request_id: req-example
            details:
              - field: body
                rule: max_bytes
                reason: Request body must not exceed 32768 bytes
    InternalError:
      description: Internal Server Error
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorCode:
      type: string
      enum: [validation, unauthorized, forbidden, not_found, conflict, rate_limited, feature_not_ready, internal]

    ErrorResponse:
      type: object
      required: [code, reason, message, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        reason:
          type: string
          example: "common.unauthorized"
        message:
          type: string
        request_id:
          type: string

    ValidationErrorDetail:
      type: object
      required: [field, rule, reason]
      properties:
        field:
          type: string
          example: "email"
        rule:
          type: string
          example: "email"
        reason:
          type: string
          example: "invalid format"

    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            code:
              type: string
              enum: [validation]
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"

    # ---- Common Enums ----
    KeywordCategory:
      type: string
      enum: [emotion, color, shape, time, abstract]

    PromptKind:
      type: string
      enum: [intuition, structure, concept]

    ReactionType:
      type: string
      enum: [inspired, resonated]

    NotificationType:
      type: string
      enum: [reaction_received]

    # ---- Auth ----
    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254

    EmailCodeRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    SignupVerifyResponse:
      type: object
      required: [signup_token]
      properties:
        signup_token:
          type: string

    SignupCompleteRequest:
      type: object
      required: [signup_token, password]
      properties:
        signup_token:
          type: string
          minLength: 16
        password:
          type: string
          minLength: 8

    LoginPasswordRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8

    ResetVerifyResponse:
      type: object
      required: [reset_token]
      properties:
        reset_token:
          type: string

    ResetCompleteRequest:
      type: object
      required: [reset_token, new_password]
      properties:
        reset_token:
          type: string
          minLength: 16
        new_password:
          type: string
          minLength: 8

    AuthToken:
      type: object
      required: [access_token, token_type]
      properties:
        token_type:
          type: string
          enum: [Bearer]
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
          nullable: true
          description: Access token expiry in seconds (optional).

    # ---- Keywords & Prompts ----
    OfficialKeyword:
      type: object
      required: [id, text, category, is_active, display_order]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 50
        category:
          $ref: "#/components/schemas/KeywordCategory"
        is_active:
          type: boolean
        display_order:
          type: integer
          minimum: 1

    ReactionCounts:
      type: object
      required: [inspired, resonated]
      properties:
        inspired:
          type: integer
          minimum: 0
        resonated:
          type: integer
          minimum: 0

    TodayKeywordResponse:
      type: object
      required: [biz_date, keyword, participant_user_count]
      properties:
        biz_date:
          type: string
          format: date
        keyword:
          $ref: "#/components/schemas/OfficialKeyword"
        participant_user_count:
          type: integer
          minimum: 0

    OfficialHomeResponse:
      type: object
      required: [today, yesterday]
      properties:
        today:
          $ref: "#/components/schemas/TodayKeywordResponse"
        yesterday:
          $ref: "#/components/schemas/TodayKeywordResponse"

    Prompt:
      type: object
      required: [id, kind, content]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PromptKind"
        content:
          type: string
          minLength: 1
          maxLength: 200

    DrawPromptRequest:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/PromptKind"
        biz_date:
          type: string
          format: date
          description: |
            Page context date (YYYY-MM-DD). New clients must send this field.
            The server must validate that this is a real calendar date, not just a matching string.
            Optional only for legacy clients; omission uses the current server business date.
            A date different from the current Asia/Shanghai date returns 409
            (official.prompt_date_changed), even if a selection already exists.
            This field cannot request a historical or future selection.
          example: "2026-09-14"

    DailyPromptSelection:
      type: object
      nullable: true
      description: Saved selection snapshot, or null if not selected at query time. The id identifies the source prompt, not a daily selection record.
      required: [id, kind, content, selected_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PromptKind"
        content:
          type: string
          minLength: 1
          maxLength: 200
          description: Content saved at selection time; later source edits, deactivation or deletion do not change it.
        selected_at:
          type: string
          format: date-time
          description: Original successful selection time (RFC3339).

    DailyPromptResponse:
      type: object
      required: [biz_date, resets_at, keyword_id, selection]
      properties:
        biz_date:
          type: string
          format: date
          description: Current server business date in Asia/Shanghai (YYYY-MM-DD).
        resets_at:
          type: string
          format: date-time
          description: Start of the next business day, at 00:00 Asia/Shanghai (RFC3339).
        keyword_id:
          type: string
          format: uuid
          nullable: true
          description: Saved keyword ID if selected; otherwise today's available official keyword ID, or null if unavailable.
        selection:
          $ref: "#/components/schemas/DailyPromptSelection"

    DrawPromptResponse:
      allOf:
        - $ref: "#/components/schemas/Prompt"
        - type: object
          required: [biz_date, keyword_id, selected_at, resets_at]
          properties:
            biz_date:
              type: string
              format: date
              description: Server business date in Asia/Shanghai (YYYY-MM-DD).
            keyword_id:
              type: string
              format: uuid
              description: Keyword ID saved with the selection; may differ from the requested keyword when already selected.
            selected_at:
              type: string
              format: date-time
              description: Original successful selection time (RFC3339).
            resets_at:
              type: string
              format: date-time
              description: Start of the next business day, at 00:00 Asia/Shanghai (RFC3339).
      description: Saved selection with the original top-level id/kind/content fields. The id is the source prompt ID. Always render the returned kind and content.

    # ---- Analytics ----
    AnalyticsEvent:
      type: object
      additionalProperties: false
      required: [event_id, event_name, kind, source, schema_version, occurred_at, selection_state]
      description: |
        One accepted user click. User identity comes only from the verified JWT.
        Unknown context_biz_date and keyword_id may be omitted or null.
        No arbitrary properties, user_id, credentials or prompt content are accepted.
        The oneOf branches enforce event_name/kind/selection_state combinations.
      properties:
        event_id:
          type: string
          format: uuid
          description: UUID generated once per accepted click. Retries reuse the same ID; another real click uses a new ID.
        event_name:
          type: string
          enum: [prompt_entry_click, prompt_kind_entry_click]
        kind:
          type: string
          nullable: true
          enum: [null, intuition, structure, concept]
          description: Must be null for the main entry; must be a valid prompt kind for a kind entry.
        source:
          type: string
          enum: [today]
        schema_version:
          type: integer
          enum: [1]
        occurred_at:
          type: string
          format: date-time
          description: Client-reported click time (RFC3339); aggregation uses the server receipt business date instead.
        context_biz_date:
          type: string
          format: date
          nullable: true
          description: Page context date (YYYY-MM-DD), or null if unknown; does not determine the aggregation date.
        keyword_id:
          type: string
          format: uuid
          nullable: true
          description: Page context keyword ID, or null if unknown.
        selection_state:
          type: string
          enum: [unknown, unselected, selected]
          description: State known at click time. A kind entry click requires unselected.
      oneOf:
        - type: object
          properties:
            event_name:
              type: string
              enum: [prompt_entry_click]
            kind:
              type: string
              nullable: true
              enum: [null]
        - type: object
          properties:
            event_name:
              type: string
              enum: [prompt_kind_entry_click]
            kind:
              $ref: "#/components/schemas/PromptKind"
            selection_state:
              type: string
              enum: [unselected]

    AnalyticsEventsBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AnalyticsEvent"

    AnalyticsEventsBatchResponse:
      type: object
      required: [acknowledged_event_ids]
      properties:
        acknowledged_event_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: IDs acknowledged after the whole batch is saved, including IDs already stored for this user. Remove these IDs from the client queue.
          items:
            type: string
            format: uuid

    # ---- Images & Uploads ----
    ImageVariant:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    ImageRef:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [original, card_4x3, square_small, square_medium]
          properties:
            original:
              $ref: "#/components/schemas/ImageVariant"
            card_4x3:
              $ref: "#/components/schemas/ImageVariant"
            square_small:
              $ref: "#/components/schemas/ImageVariant"
            square_medium:
              $ref: "#/components/schemas/ImageVariant"

    ImageRefSquareSmall:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [square_small]
          properties:
            square_small:
              $ref: "#/components/schemas/ImageVariant"

    ImageRefSquareMedium:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [square_medium]
          properties:
            square_medium:
              $ref: "#/components/schemas/ImageVariant"

    ImageRefCard4x3:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [card_4x3]
          properties:
            card_4x3:
              $ref: "#/components/schemas/ImageVariant"

    ImageRefOriginal:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [original]
          properties:
            original:
              $ref: "#/components/schemas/ImageVariant"

    ImageRefDetailLarge:
      type: object
      required: [id, variants]
      properties:
        id:
          type: string
          format: uuid
        variants:
          type: object
          required: [detail_large]
          properties:
            detail_large:
              $ref: "#/components/schemas/ImageVariant"

    UploadPublishContextType:
      type: string
      enum: [official_today, custom_keyword]

    UploadPublishSessionStatus:
      type: string
      enum: [created, committed, canceled, expired]

    UploadPublishSessionItemStatus:
      type: string
      enum: [pending_upload, uploaded]

    UploadPublishVisibilityStatus:
      type: string
      enum: [processing, visible, hidden, deleted]

    UploadPublishSessionContext:
      type: object
      required: [type]
      properties:
        type:
          $ref: "#/components/schemas/UploadPublishContextType"
        official_keyword_id:
          type: string
          format: uuid
          nullable: true
        biz_date:
          type: string
          format: date
          nullable: true
          description: >
            Official publish date in Asia/Shanghai. The server accepts today,
            past dates with an existing saved schedule, and rejects missing past
            schedules and all future dates.
        custom_keyword_id:
          type: string
          format: uuid
          nullable: true

    CreateUploadPublishSessionRequest:
      type: object
      required: [context]
      properties:
        context:
          $ref: "#/components/schemas/UploadPublishSessionContext"
        expected_image_count:
          type: integer
          minimum: 1
          nullable: true

    CreateUploadPublishSessionResponse:
      type: object
      required: [session_id, status, expires_at]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadPublishSessionStatus"
        expires_at:
          type: string
          format: date-time

    UploadPublishSessionItemSummary:
      type: object
      required: [item_id, client_image_id, status, is_cover, has_audio]
      properties:
        item_id:
          type: string
          format: uuid
        client_image_id:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/UploadPublishSessionItemStatus"
        display_order:
          type: integer
          minimum: 1
          nullable: true
        is_cover:
          type: boolean
        has_audio:
          type: boolean
        title:
          type: string
          maxLength: 80
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true

    UploadPresignedTarget:
      type: object
      required: [method, url, object_key, expires_at]
      properties:
        method:
          type: string
          enum: [POST, PUT]
        url:
          type: string
          format: uri
        headers:
          type: object
          additionalProperties:
            type: string
          nullable: true
        form_fields:
          type: object
          additionalProperties:
            type: string
          nullable: true
        object_key:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time

    UploadPublishPresignBatchItemRequest:
      type: object
      required: [client_image_id, image_content_type, image_content_length]
      description: >
        One batch item represents one image in the upload flow. The item may
        optionally include one bound audio file. Order, cover choice, title,
        and note are not submitted here; they are submitted later in
        complete-batch after client uploads finish.
      properties:
        client_image_id:
          type: string
          minLength: 1
        image_content_type:
          type: string
          example: image/jpeg
        image_content_length:
          type: integer
          format: int64
          minimum: 1
        image_sha256:
          type: string
          nullable: true
        audio_content_type:
          type: string
          nullable: true
          example: audio/aac
        audio_content_length:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        audio_sha256:
          type: string
          nullable: true

    UploadPublishPresignBatchRequest:
      type: object
      required: [items]
      description: >
        The client calls this once after local editing is done. Each item
        describes one image and an optional bound audio file to presign for
        direct upload.
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/UploadPublishPresignBatchItemRequest"

    UploadPublishPresignBatchItemResponse:
      type: object
      required: [client_image_id, item_id, image_id, image_upload]
      properties:
        client_image_id:
          type: string
        item_id:
          type: string
          format: uuid
        image_id:
          type: string
          format: uuid
        image_upload:
          $ref: "#/components/schemas/UploadPresignedTarget"
        audio_upload:
          allOf:
            - $ref: "#/components/schemas/UploadPresignedTarget"
          nullable: true

    UploadPublishPresignBatchResponse:
      type: object
      required: [session_id, items]
      properties:
        session_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/UploadPublishPresignBatchItemResponse"

    UploadPublishCompleteBatchItemRequest:
      type: object
      required: [item_id, image_etag, image_width, image_height, display_order]
      description: >
        One completed upload item. This is where the client submits the final
        metadata for that image in a single round-trip, including optional
        audio, optional title/note, final order, and optional cover flag.
      properties:
        item_id:
          type: string
          format: uuid
          description: Must be unique within one batch request.
        image_etag:
          type: string
          minLength: 1
        image_width:
          type: integer
          minimum: 1
        image_height:
          type: integer
          minimum: 1
        display_order:
          type: integer
          minimum: 1
          description: Final image order candidate. At commit time all completed items must form a continuous sequence from 1.
        is_cover:
          type: boolean
          nullable: true
          description: Cover candidate for this item. Across one upload, at most one image can be cover.
        title:
          type: string
          maxLength: 80
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        audio_etag:
          type: string
          nullable: true
        audio_duration_ms:
          type: integer
          minimum: 1
          nullable: true

    UploadPublishCompleteBatchRequest:
      type: object
      required: [items]
      description: >
        The client submits all finalized item metadata in one request after all
        direct uploads succeed. There are no separate cover or reorder APIs.
      properties:
        items:
          type: array
          minItems: 1
          description: item_id and display_order should both be unique in the same request.
          items:
            $ref: "#/components/schemas/UploadPublishCompleteBatchItemRequest"

    UploadPublishCompleteBatchItemResponse:
      type: object
      required: [item_id, status, display_order, is_cover]
      properties:
        item_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadPublishSessionItemStatus"
        display_order:
          type: integer
        is_cover:
          type: boolean

    UploadPublishCompleteBatchResponse:
      type: object
      required: [session_id, status, items]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadPublishSessionStatus"
        items:
          type: array
          items:
            $ref: "#/components/schemas/UploadPublishCompleteBatchItemResponse"

    UploadPublishCommitResponse:
      type: object
      required: [session_id, upload_id, status, upload_visibility]
      properties:
        session_id:
          type: string
          format: uuid
        upload_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadPublishSessionStatus"
        upload_visibility:
          $ref: "#/components/schemas/UploadPublishVisibilityStatus"

    SetCustomKeywordCoverRequest:
      type: object
      required: [image_id]
      properties:
        image_id:
          type: string
          format: uuid

    SetCustomKeywordCoverResponse:
      type: object
      required: [keyword_id, cover_source]
      properties:
        keyword_id:
          type: string
          format: uuid
        cover_source:
          $ref: "#/components/schemas/CustomKeywordCoverSource"
        cover_image:
          $ref: "#/components/schemas/ImageRefDetailLarge"
          nullable: true

    # ---- WorkUploads / WorkImages ----
    WorkImage:
      type: object
      required: [id, image, display_order, has_audio, created_at]
      properties:
        id:
          type: string
          format: uuid
        image:
          $ref: "#/components/schemas/ImageRefDetailLarge"
        display_order:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 80
          nullable: true
        note:
          type: string
          maxLength: 500
          nullable: true
        has_audio:
          type: boolean
        audio_duration_ms:
          type: integer
          minimum: 1
          nullable: true
        audio_play_url:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time

    PublicWorkUploadCard:
      type: object
      required: [id, biz_date, keyword_id, cover_image, image_count, created_at]
      properties:
        id:
          type: string
          format: uuid
        biz_date:
          type: string
          format: date
        keyword_id:
          type: string
          format: uuid
        cover_image:
          $ref: "#/components/schemas/ImageRefCard4x3"
        display_text:
          type: string
          maxLength: 500
          nullable: true
          description: UI text for list card, fallback policy decided by server (title first, else note).
        cover_has_audio:
          type: boolean
          nullable: true
        cover_audio_duration_ms:
          type: integer
          minimum: 1
          nullable: true
        image_count:
          type: integer
          minimum: 1
        reaction_counts:
          $ref: "#/components/schemas/ReactionCounts"
          nullable: true
        my_reactions:
          type: array
          items:
