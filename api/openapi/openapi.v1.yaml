          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: not_found
                reason: official.prompt_not_available
                message: No prompt is available for selection
                request_id: req-example
        "409":
          description: Context changed. Refresh official home and daily prompt state before another user-initiated selection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                dateChanged:
                  summary: 页面日期与服务端当天日期不一致，优先于已领取判断
                  value:
                    code: conflict
                    reason: official.prompt_date_changed
                    message: The business date has changed
                    request_id: req-example
                keywordMismatch:
                  summary: 首次领取的关键词不是当天分配的官方关键词
                  value:
                    code: conflict
                    reason: official.keyword_mismatch
                    message: The keyword does not match today's official keyword
                    request_id: req-example
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---- Analytics ----

  /v1/analytics/events/batch:
    post:
      tags: [Analytics]
      operationId: batchAnalyticsEvents
      summary: 批量上报提示入口点击事件
      description: |
        Implemented backend contract for prompt-entry analytics.
        Accepts 1-20 events per batch and at most 32768 bytes (32 KiB) per request body.
        The byte limit is enforced before OpenAPI body decoding; x-max-body-bytes documents that limit.
        Identity is taken only from the verified JWT; user_id is not a request field.
        All events must pass validation before the entire batch is saved in one transaction.
        Duplicate (user_id, event_id) pairs are acknowledged without inserting again
        or updating the first saved event. A 200 response acknowledges all IDs in the batch.
        Invalid fields or event combinations return 400 validation/validation.failed
        and write nothing. Oversized bodies return 413 validation/validation.failed.
        Authentication, rate limiting and storage failures use
        401 unauthorized/common.unauthorized, 429 rate_limited/common.rate_limited
        and 500 internal/common.internal. A failed transaction saves no events.

        prompt_entry_click records an accepted main-entry click, including revisits;
        kind must be null and selection_state is the state known at click time.
        prompt_kind_entry_click records an accepted kind click before claiming;
        kind must be intuition (直觉), structure (空间) or concept (观念), and
        selection_state must be unselected. A failed claim still counts as a click.
        Prefetching, rendering, automatic display, tutorial actions, disabled or
        blocked clicks and automatic request retries do not create new events.

        Send asynchronously without blocking UI or showing business error messages.
        Retry network errors, 429 and 5xx with backoff and the original event IDs.
        Aggregate clicks and distinct users separately per event_name/kind using the
        server receipt date in Asia/Shanghai. Delayed events count on the receipt date;
        occurred_at and context_biz_date are diagnostic context only.
        Clicks and successful HTTP responses are not successful-selection counts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        description: JSON body limited to 32768 bytes (32 KiB), including all events.
        x-max-body-bytes: 32768
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventsBatchRequest"
            examples:
              entryClick:
                summary: 提示总入口点击
                value:
                  events:
                    - event_id: "33333333-3333-4333-8333-333333333333"
                      event_name: prompt_entry_click
                      kind: null
                      source: today
                      schema_version: 1
                      occurred_at: "2026-09-14T10:29:50+08:00"
                      context_biz_date: "2026-09-14"
                      keyword_id: "11111111-1111-4111-8111-111111111111"
                      selection_state: unknown
              kindClick:
                summary: 空间类型入口点击
                value:
                  events:
                    - event_id: "44444444-4444-4444-8444-444444444444"
                      event_name: prompt_kind_entry_click
                      kind: structure
                      source: today
                      schema_version: 1
                      occurred_at: "2026-09-14T10:30:00+08:00"
                      context_biz_date: "2026-09-14"
                      keyword_id: "11111111-1111-4111-8111-111111111111"
                      selection_state: unselected
              unknownContext:
                summary: 日期和关键词尚未加载时点击总入口
                value:
                  events:
                    - event_id: "55555555-5555-4555-8555-555555555555"
                      event_name: prompt_entry_click
                      kind: null
                      source: today
                      schema_version: 1
                      occurred_at: "2026-09-14T10:29:45+08:00"
                      context_biz_date: null
                      keyword_id: null
                      selection_state: unknown
      responses:
        "200":
          description: All events acknowledged after saving the batch, including duplicates already stored for this user.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsEventsBatchResponse"
              example:
                acknowledged_event_ids:
                  - "33333333-3333-4333-8333-333333333333"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

