  /v1/official/keywords/{keyword_id}/prompts/draw:
    post:
      tags: [Official]
      operationId: drawOfficialPrompt
      summary: 领取今日提示或返回当天已选提示
      description: |
        Implemented backend contract for the daily-selection feature.
        Requires login. Each user can save one prompt per Asia/Shanghai business date,
        shared across all kinds and keywords. Clicking a kind claims immediately.
        Identity comes from the verified JWT, not the request body.

        Validate the keyword UUID, kind and optional biz_date first. A date different
        from the server date returns 409 official.prompt_date_changed before checking
        an existing selection. Omitted biz_date uses today for legacy compatibility.
        An existing selection returns its original id, kind, content, keyword_id and
        selected_at, even when a different valid kind or keyword UUID is requested.
        Without an existing selection, the keyword must match today's official keyword
        (409 official.keyword_mismatch otherwise). No available keyword or no active
        prompt of the requested kind returns 404 official.prompt_not_available.

        Concurrent requests return the first successfully saved selection. Only a
        successful save consumes the daily allowance; retries do not draw again.
        Source edits, deactivation or deletion do not change the saved snapshot.
        Render the returned kind, which can differ from the clicked kind.
        On timeout or an uncertain outcome, query GET /v1/me/daily-prompt to confirm.
        On either 409 reason, refresh the official home and daily state and require
        a new user click; do not automatically claim for the new context.
        Invalid parameters use 400 validation/validation.failed; authentication,
        rate limiting and server failures use 401 unauthorized/common.unauthorized,
        429 rate_limited/common.rate_limited and 500 internal/common.internal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: keyword_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawPromptRequest"
            examples:
              currentClient:
                summary: 新客户端始终携带页面业务日期
                value:
                  kind: structure
                  biz_date: "2026-09-14"
              legacyClient:
                summary: 旧客户端暂可省略日期，但仍需登录并受每日额度限制
                value:
                  kind: structure
      responses:
        "200":
          description: Newly saved or previously saved daily selection. Both return the same response shape.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawPromptResponse"
              example:
                id: "22222222-2222-4222-8222-222222222222"
                kind: structure
                content: "你和别人之间，隔着多远？"
                biz_date: "2026-09-14"
                keyword_id: "11111111-1111-4111-8111-111111111111"
                selected_at: "2026-09-14T10:30:00+08:00"
                resets_at: "2026-09-15T00:00:00+08:00"
