  # ---- Me ----

  /v1/me/daily-prompt:
    get:
      tags: [Me]
      operationId: getMeDailyPrompt
      summary: 查询我的今日提示状态
      description: |
        Implemented backend contract for the daily-selection feature.
        Returns the authenticated user's current Asia/Shanghai business date and saved
        selection. Does not accept keyword or historical date parameters. No prompt is
        drawn and no daily selection is created; today's official keyword may be assigned
        on demand. Identity comes from the verified JWT.

        selection=null means not selected at query time; another device may select later.
        If no official keyword is available, return 200 with keyword_id=null and
        selection=null. After selection, always return the saved keyword ID and snapshot,
        even if the source keyword or prompt has changed, been deactivated or deleted.
        The id is the source prompt ID, and selected_at is the original selection time.

        Supports prefetch, background refresh, app restart and confirmation after a claim
        times out. Clients may immediately display valid in-memory state for the same
        account and business date, refreshing in the background. Invalidate on account
        change, 401, resets_at, date mismatch or uncertain claim outcome. A failed query
        is not an unselected result; an older empty GET must not overwrite a confirmed
        selection. On uncertain claim outcome, issue a fresh GET started after that claim.
        Authentication, rate limiting and server failures use
        401 unauthorized/common.unauthorized, 429 rate_limited/common.rate_limited
        and 500 internal/common.internal.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Current daily state; unavailable keywords are a successful empty state, not a 404.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/X-Request-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPromptResponse"
              examples:
                unselected:
                  summary: 当天尚未领取
                  value:
                    biz_date: "2026-09-14"
                    resets_at: "2026-09-15T00:00:00+08:00"
                    keyword_id: "11111111-1111-4111-8111-111111111111"
                    selection: null
                selected:
                  summary: 返回当天已保存的原提示
                  value:
                    biz_date: "2026-09-14"
                    resets_at: "2026-09-15T00:00:00+08:00"
                    keyword_id: "11111111-1111-4111-8111-111111111111"
                    selection:
                      id: "22222222-2222-4222-8222-222222222222"
                      kind: structure
                      content: "你和别人之间，隔着多远？"
                      selected_at: "2026-09-14T10:30:00+08:00"
                unavailable:
                  summary: 尚未领取且当天无可用官方关键词
                  value:
                    biz_date: "2026-09-14"
                    resets_at: "2026-09-15T00:00:00+08:00"
                    keyword_id: null
                    selection: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

